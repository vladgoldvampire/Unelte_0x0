<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Pathing - Official Constants Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #1e1e1e;
            color: #ffffff;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .header-bar h2 {
            margin: 0;
        }
        .home-btn {
            padding: 8px 16px;
            background-color: #3c3c3c;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #555;
            transition: background-color 0.2s;
        }
        .home-btn:hover {
            background-color: #505050;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .form-section, .output-section {
            flex: 1;
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        label {
            display: block;
            margin-top: 8px;
            font-weight: bold;
            font-size: 12px;
            color: #cccccc;
        }
        input, select {
            width: 90%;
            padding: 6px;
            margin-top: 3px;
            background: #3c3c3c;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
        }
        textarea {
            width: 100%;
            height: 650px;
            background: #1e1e1e;
            color: #dcdcdc;
            font-family: monospace;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            box-sizing: border-box;
            resize: none;
        }
        button {
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }
        button:hover {
            background-color: #1177bb;
        }
        h4 {
            margin-top: 15px;
            margin-bottom: 5px;
            color: #007acc;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2>0x0 SQUAD - Pedro Pathing Official Constants Generator</h2>
        <a href="index.html" class="home-btn">🏠 Home Page</a>
    </div>

    <div class="container">
        <!-- Formular Tuning -->
        <div class="form-section">
            
            <!-- Follower Constants -->
            <h4>1. Follower Constants</h4>
            <div class="grid-2">
                <div><label>Masa Robotului (Mass):</label><input type="number" id="mass" value="10"></div>
            </div>
            
            <label>Heading PIDF (P, I, D, F):</label>
            <div class="grid-2">
                <input type="number" step="0.001" id="headP" value="0.02">
                <input type="number" step="0.001" id="headI" value="0.04">
                <input type="number" step="0.001" id="headD" value="0.03">
                <input type="number" step="0.001" id="headF" value="1">
            </div>

            <label>Predictive Braking Coeffs:</label>
            <div class="grid-3">
                <input type="number" step="0.00001" id="brake1" value="0.1">
                <input type="number" step="0.00001" id="brake2" value="0.10990335713630847">
                <input type="number" step="0.00001" id="brake3" value="0.0018092121587316584">
            </div>

            <!-- Mecanum Drive Constants -->
            <h4>2. Mecanum Drive Constants</h4>
            <div class="grid-3">
                <div><label>Max Power:</label><input type="number" step="0.1" id="maxPower" value="1"></div>
                <div><label>X Velocity:</label><input type="number" step="0.001" id="xVel" value="62.105"></div>
                <div><label>Y Velocity:</label><input type="number" step="0.001" id="yVel" value="48.56537874477116"></div>
            </div>

            <label>Nume Motoare (HardwareMap):</label>
            <div class="grid-2">
                <div><input type="text" id="rfName" value="rf"></div>
                <div><input type="text" id="rrName" value="rr"></div>
                <div><input type="text" id="lrName" value="lr"></div>
                <div><input type="text" id="lfName" value="lf"></div>
            </div>

            <label>Direcție Motoare:</label>
            <div class="grid-2">
                <div>
                    <label>Left Front:</label>
                    <select id="lfDir"><option value="REVERSE">REVERSE</option><option value="FORWARD">FORWARD</option></select>
                </div>
                <div>
                    <label>Left Rear:</label>
                    <select id="lrDir"><option value="REVERSE">REVERSE</option><option value="FORWARD">FORWARD</option></select>
                </div>
                <div>
                    <label>Right Front:</label>
                    <select id="rfDir"><option value="FORWARD">FORWARD</option><option value="REVERSE">REVERSE</option></select>
                </div>
                <div>
                    <label>Right Rear:</label>
                    <select id="rrDir"><option value="FORWARD">FORWARD</option><option value="REVERSE">REVERSE</option></select>
                </div>
            </div>

            <!-- Pinpoint Localizer Constants -->
            <h4>3. Pinpoint Localizer Constants</h4>
            <div class="grid-2">
                <div><label>Forward Pod Y (mm):</label><input type="number" id="fwdY" value="145"></div>
                <div><label>Strafe Pod X (mm):</label><input type="number" id="strafeX" value="-70"></div>
                <div><label>Hardware Name:</label><input type="text" id="pinpointName" value="pinpoint"></div>
                <div>
                    <label>Pod Model:</label>
                    <select id="podModel">
                        <option value="goBILDA_4_BAR_POD">goBILDA_4_BAR_POD</option>
                        <option value="goBILDA_SWINGARM_POD">goBILDA_SWINGARM_POD</option>
                    </select>
                </div>
            </div>
            
            <div class="grid-2">
                <div>
                    <label>Forward Enc Dir:</label>
                    <select id="fwdEncDir"><option value="REVERSED">REVERSED</option><option value="FORWARD">FORWARD</option></select>
                </div>
                <div>
                    <label>Strafe Enc Dir:</label>
                    <select id="strafeEncDir"><option value="REVERSED">REVERSED</option><option value="FORWARD">FORWARD</option></select>
                </div>
            </div>

            <!-- Path Constraints -->
            <h4>4. Path Constraints</h4>
            <div class="grid-2">
                <div><label>Constraint 1:</label><input type="number" step="0.01" id="c1" value="0.99"></div>
                <div><label>Constraint 2:</label><input type="number" id="c2" value="100"></div>
                <div><label>Constraint 3:</label><input type="number" id="c3" value="1"></div>
                <div><label>Constraint 4:</label><input type="number" id="c4" value="1"></div>
            </div>

        </div>

        <!-- Output Cod -->
        <div class="output-section">
            <h3>Constants.java Generat</h3>
            <textarea id="codeOutput" readonly></textarea>
            <button onclick="copyCode()">Copiază Constants.java</button>
        </div>
    </div>

    <script>
        function generateCode() {
            const mass = document.getElementById('mass').value;
            const headP = document.getElementById('headP').value;
            const headI = document.getElementById('headI').value;
            const headD = document.getElementById('headD').value;
            const headF = document.getElementById('headF').value;

            const brake1 = document.getElementById('brake1').value;
            const brake2 = document.getElementById('brake2').value;
            const brake3 = document.getElementById('brake3').value;

            const maxPower = document.getElementById('maxPower').value;
            const xVel = document.getElementById('xVel').value;
            const yVel = document.getElementById('yVel').value;

            const rfName = document.getElementById('rfName').value;
            const rrName = document.getElementById('rrName').value;
            const lrName = document.getElementById('lrName').value;
            const lfName = document.getElementById('lfName').value;

            const lfDir = document.getElementById('lfDir').value;
            const lrDir = document.getElementById('lrDir').value;
            const rfDir = document.getElementById('rfDir').value;
            const rrDir = document.getElementById('rrDir').value;

            const fwdY = document.getElementById('fwdY').value;
            const strafeX = document.getElementById('strafeX').value;
            const pinpointName = document.getElementById('pinpointName').value;
            const podModel = document.getElementById('podModel').value;

            const fwdEncDir = document.getElementById('fwdEncDir').value;
            const strafeEncDir = document.getElementById('strafeEncDir').value;

            const c1 = document.getElementById('c1').value;
            const c2 = document.getElementById('c2').value;
            const c3 = document.getElementById('c3').value;
            const c4 = document.getElementById('c4').value;

            const javaCode = `package org.firstinspires.ftc.teamcode.pedroPathing;

import com.pedropathing.control.PIDFCoefficients;
import com.pedropathing.control.PredictiveBrakingCoefficients;
import com.pedropathing.follower.Follower;
import com.pedropathing.follower.FollowerConstants;
import com.pedropathing.ftc.FollowerBuilder;
import com.pedropathing.ftc.drivetrains.MecanumConstants;
import com.pedropathing.ftc.localization.constants.PinpointConstants;
import com.pedropathing.paths.PathConstraints;
import com.qualcomm.hardware.gobilda.GoBildaPinpointDriver;
import com.qualcomm.robotcore.hardware.DcMotorSimple;
import com.qualcomm.robotcore.hardware.HardwareMap;

import org.firstinspires.ftc.robotcore.external.navigation.DistanceUnit;

public class Constants {
    public static FollowerConstants followerConstants = new FollowerConstants()
            .mass(${mass})
            .headingPIDFCoefficients(new PIDFCoefficients(${headP}, ${headI}, ${headD}, ${headF}))
            .predictiveBrakingCoefficients(new PredictiveBrakingCoefficients(${brake1}, ${brake2}, ${brake3}));

    public static MecanumConstants driveConstants = new MecanumConstants()
            .maxPower(${maxPower})
            .xVelocity(${xVel})
            .yVelocity(${yVel})
            .rightFrontMotorName("${rfName}")
            .rightRearMotorName("${rrName}")
            .leftRearMotorName("${lrName}")
            .leftFrontMotorName("${lfName}")
            .leftFrontMotorDirection(DcMotorSimple.Direction.${lfDir})
            .leftRearMotorDirection(DcMotorSimple.Direction.${lrDir})
            .rightFrontMotorDirection(DcMotorSimple.Direction.${rfDir})
            .rightRearMotorDirection(DcMotorSimple.Direction.${rrDir});

    public static PinpointConstants localizerConstants = new PinpointConstants()
            .forwardPodY(${fwdY})
            .strafePodX(${strafeX})
            .distanceUnit(DistanceUnit.MM)
            .hardwareMapName("${pinpointName}")
            .encoderResolution(GoBildaPinpointDriver.GoBildaOdometryPods.${podModel})
            .forwardEncoderDirection(GoBildaPinpointDriver.EncoderDirection.${fwdEncDir})
            .strafeEncoderDirection(GoBildaPinpointDriver.EncoderDirection.${strafeEncDir});

    public static PathConstraints pathConstraints = new PathConstraints(${c1}, ${c2}, ${c3}, ${c4});

    public static Follower createFollower(HardwareMap hardwareMap) {
        return new FollowerBuilder(followerConstants, hardwareMap)
                .pinpointLocalizer(localizerConstants)
                .pathConstraints(pathConstraints)
                .mecanumDrivetrain(driveConstants)
                .build();
    }
}`;

            document.getElementById('codeOutput').value = javaCode;
        }

        function copyCode() {
            const codeOutput = document.getElementById('codeOutput');
            codeOutput.select();
            document.execCommand('copy');
            alert('Constants.java a fost copiat în clipboard!');
        }

        document.querySelectorAll('input, select').forEach(element => {
            element.addEventListener('input', generateCode);
        });

        generateCode();
    </script>
<p style="text-align:center; color: #777; font-size: 12px;">
    © 2026 0x0 SQUAD. Released under the MIT License.
</p>
</body>
</html>
